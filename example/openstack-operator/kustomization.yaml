---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# openstack-operator is deployed from the cluster's own redhat-operators
# catalog (no pinned CatalogSource image, no pinned CSV), see
# ../../components/dependencies/openstack-operator/README.md.
# approve-installplan must run after the Subscription exists (it patches
# the Subscription sync-wave).
components:
  - ../../components/dependencies/openstack-operator
  - ../../components/utilities/approve-installplan
